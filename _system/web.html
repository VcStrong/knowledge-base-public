<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地知识库</title>
<meta name="author" content="From 大大王.DT">
<!-- From 大大王.DT -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f3f5f9;--fg:#1c2433;--mut:#667085;--card:#ffffff;--line:#e3e7ef;--soft:#eef1f6;--acc:#3b5bdb;--accb:#e7ecfd;
--side:#1f2a44;--side-fg:#c9d2e6;--side-act:#ffffff;
--s0:#667085;--s0b:#eef1f6;--s1:#b54708;--s1b:#fdf0e1;--s2:#3b5bdb;--s2b:#e7ecfd;--s3:#1f8a4c;--s3b:#e3f4ea;--s4:#c4321f;--s4b:#fde8e5;--warn:#c4321f;
--info:#0b6bcb;--infob:#e2effc;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141d;--fg:#e6eaf2;--mut:#98a2b3;--card:#171e2a;--line:#283245;--soft:#1e2635;--acc:#7c97ff;--accb:#1f2a4d;
--side:#111827;--side-fg:#9aa6bf;--side-act:#ffffff;
--s0:#98a2b3;--s0b:#1e2635;--s1:#f5a454;--s1b:#3a2915;--s2:#7c97ff;--s2b:#1f2a4d;--s3:#4fd08a;--s3b:#173326;--s4:#ff8a7a;--s4b:#3d1c19;--warn:#ff8a7a;
--info:#6cb4ff;--infob:#15293f;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141d;--fg:#e6eaf2;--mut:#98a2b3;--card:#171e2a;--line:#283245;--soft:#1e2635;--acc:#7c97ff;--accb:#1f2a4d;
--side:#111827;--side-fg:#9aa6bf;--side-act:#ffffff;
--s0:#98a2b3;--s0b:#1e2635;--s1:#f5a454;--s1b:#3a2915;--s2:#7c97ff;--s2b:#1f2a4d;--s3:#4fd08a;--s3b:#173326;--s4:#ff8a7a;--s4b:#3d1c19;--warn:#ff8a7a;
--info:#6cb4ff;--infob:#15293f;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-body)}
code,.mono{font-family:var(--f-mono);font-size:12px}
a{color:var(--acc);text-decoration:none;cursor:pointer}
/* 布局：左侧固定导航 + 顶部搜索栏 + 内容区 */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-act);font-weight:700;font-size:16px;padding:4px 10px 14px}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;font-style:normal;font-size:13px}
.navh{font-size:11px;letter-spacing:.08em;opacity:.55;padding:12px 10px 4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px}
.navh:hover{opacity:.85}.navh::before{content:'›';font-size:14px;line-height:1;width:10px;display:inline-block;text-align:center;transform:rotate(90deg);transition:transform .15s}.navh.fold::before{transform:none}
.navh .hd{width:6px;height:6px;border-radius:50%;background:var(--s1);display:none}.navh.fold.alert .hd{display:inline-block}
.navh.fold+.navb{display:none}.navb{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--side-fg);min-width:0}
.nav:hover{background:rgba(255,255,255,.06);color:var(--side-act)}
.nav.on{background:rgba(255,255,255,.12);color:var(--side-act);font-weight:500}
.nav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.nav .n{font-size:11px;background:rgba(255,255,255,.14);border-radius:999px;padding:0 7px;flex:none}
.nav .n.w{background:var(--s4);color:#fff}.nav .n.q{background:var(--s1);color:#fff}
.nav .d{width:7px;height:7px;border-radius:50%;flex:none;background:var(--s0)}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:10px;display:flex;align-items:center;gap:6px}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px}
.topbar form{flex:1;max-width:680px;display:flex;gap:6px;min-width:0}
.topbar .sp{flex:1}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.topbar{padding:8px 12px}main{padding:14px 12px 50px}.topbar #scope{display:none}.kpi>.small{display:none}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side .navh,.side .foot,.side .plist{display:none}.brand{width:100%}}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],textarea,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=text]{flex:1;min-width:0}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:hover{border-color:var(--acc)}
main{max-width:1280px;width:100%;padding:20px 20px 60px}
h1{font-size:22px;margin:4px 0 8px}h2{font-size:16px;margin:24px 0 10px}
.mut{color:var(--mut)}.small{font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--soft);border-radius:10px;padding:8px;min-height:120px}
.col h3{font-size:13px;margin:2px 4px 8px;display:flex;justify-content:space-between}
.pcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;color:var(--fg)}
.pcard:hover{border-color:var(--acc)}
.pcard .t{font-weight:600}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--mut)}
.chip.zero{color:var(--warn)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;font-weight:500}
.st-收集中{color:var(--s0);background:var(--s0b)}.st-已批准开发{color:var(--s1);background:var(--s1b)}
.st-开发中{color:var(--s2);background:var(--s2b)}.st-已完成{color:var(--s3);background:var(--s3b)}.st-已暂停{color:var(--s4);background:var(--s4b)}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-weight:500}
.tw{overflow-x:auto}
.steps{display:flex;gap:0;margin:12px 0 4px;flex-wrap:wrap}
.step{flex:1;min-width:110px;padding:8px 10px;border-top:3px solid var(--line);color:var(--mut)}
.step.done{border-color:var(--s3);color:var(--fg)}.step.cur{border-color:var(--acc);color:var(--fg);font-weight:600}
.step small{display:block;font-weight:400;color:var(--mut)}
.notice{background:var(--s1b);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice code{background:var(--card);padding:2px 6px;border-radius:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.cat{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;box-shadow:var(--shadow)}
.cat .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.cat .bd{padding:8px 12px}
details.cat:not([open])>summary.hd{border-bottom:0}
details.cat>summary.hd::before{content:'▸';margin-right:6px;color:var(--mut)}
details.cat[open]>summary.hd::before{content:'▾'}
details.cat>summary.hd{list-style:none}
details.cat>summary.hd>b{flex:1}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:8px;text-align:center;color:var(--mut);font-size:12px;margin-top:8px;cursor:pointer}
.drop.over{border-color:var(--acc);background:var(--accb);color:var(--acc)}
.files li{list-style:none;padding:4px 0;border-bottom:1px solid var(--soft);display:flex;justify-content:space-between;gap:8px}
.files{margin:0;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft);cursor:pointer}
.thumb img{width:100%;height:110px;object-fit:cover;display:block}
.thumb div{padding:4px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nonote{color:var(--warn)}
.tl{max-height:75vh;overflow:auto}
.tl .it{padding:6px 0;border-bottom:1px solid var(--soft);word-break:break-all}
.tl .it .a{font-weight:500}
.hit{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.hit .p{font-size:12px;color:var(--mut);word-break:break-all}
.hit .s{white-space:pre-wrap;word-break:break-word}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);width:min(1000px,94vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog.mini{width:min(460px,92vw);margin:auto}
dialog .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
dialog .bd{padding:12px 14px;overflow:auto;max-height:calc(90vh - 52px)}
dialog pre{white-space:pre-wrap;word-break:break-word;font-size:12.5px;margin:0}
dialog img{max-width:100%}
.toast{position:fixed;right:16px;bottom:16px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;max-width:420px;white-space:pre-wrap;z-index:20}
.toast.show{opacity:.95}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;padding:6px 10px;margin-bottom:6px;background:var(--card)}
.note.k-分支{border-left-color:var(--s3)}.note.k-链接{border-left-color:var(--s1)}.note.k-其他{border-left-color:var(--s0)}
.note .nb{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.note .nu{word-break:break-all;font-size:13px}
.note .ops{margin-left:auto;display:flex;gap:10px;font-size:12px}
.form{display:grid;gap:8px}.form label{display:grid;gap:3px;font-size:12px;color:var(--mut)}
.form input[type=text],.form textarea,.form select{width:100%}
.dev{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px}
.dev .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dev .top .sp{flex:1}
.sw{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.sw i{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:.15s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--acc)}.sw.on i:after{left:16px}
button.danger{border-color:var(--warn);color:var(--warn)}
.q{border:1.5px solid var(--s1);background:var(--s1b);border-radius:10px;padding:10px 12px;margin:10px 0}
.q .ctx{background:var(--card);border-radius:8px;padding:2px 10px;margin:6px 0;font-size:13px}
.q textarea{width:100%;margin-top:6px}
.iss{border-left:3px solid var(--warn);background:var(--soft);border-radius:6px;padding:3px 10px;margin:3px 0;font-size:13px}
.iss details summary{font-size:11px}
.iss.done{border-left-color:var(--mut);opacity:.75}
.iss button,.devrow button{font-size:12px;padding:1px 8px}
.retest{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:12px}
.devrow{padding:4px 0;border-bottom:1px solid var(--soft)}
.chat{margin-top:8px}.chat textarea{width:100%}
.chat .msg{font-size:12px;padding:2px 0;color:var(--mut)}.chat .msg b{color:var(--fg);font-weight:500}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.pst{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pst.done{border-color:var(--s3)}.pst.run{border-color:var(--acc);background:var(--accb)}.pst.skip{opacity:.6}
.pbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft);margin:6px 0}
.pbar span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.act{max-height:320px;overflow:auto;font-size:12.5px}
.raw .msg{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}
.raw .msg.u{border-color:var(--info);background:color-mix(in srgb,var(--info) 7%,var(--card))}
.raw .msg .who{font-size:12px;color:var(--mut);margin-bottom:2px}
.raw .msg .md{border:0;padding:0;margin:0;background:none;box-shadow:none;max-width:none;overflow-wrap:anywhere}
.raw .steps{font-size:12.5px;margin:4px 0 4px 14px;color:var(--mut)}
.raw .tools{font-size:12.5px;margin-top:4px}.raw .tools pre{max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12px}
.cand{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}
.pushin textarea{width:100%}
.act div{padding:4px 0;border-bottom:1px solid var(--soft);word-break:break-word;white-space:pre-wrap}
.live{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block;opacity:.5}.live.on{background:#2ea44f;opacity:1}
.act .tool{color:var(--mut)}.act .end{font-weight:600}.act .sess{color:var(--acc);font-weight:600;border-bottom:none;padding-top:10px}
.arec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.arec .in{white-space:pre-wrap;word-break:break-all;background:var(--soft);border-radius:6px;padding:6px 8px;margin:6px 0;font-size:12.5px;max-height:90px;overflow:auto}
.arec .res p{margin:4px 0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bcard .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bcard table{border:none;margin-top:6px}.bcard td{padding:4px 6px;font-size:13px}.bcard td:first-child{color:var(--mut);width:30%;white-space:nowrap}
.sec{font-family:ui-monospace,Menlo,monospace}
.bcard .md{border:none;padding:0;background:none;border-radius:0}
.frow{display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:6px;align-items:center}
.docs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:800px){.docs{grid-template-columns:1fr}}
.dnav{position:sticky;top:64px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:calc(100vh - 80px);overflow:auto}
.dnav a{display:block;padding:5px 8px;border-radius:6px;color:var(--fg)}
.dnav a.on{background:var(--accb);color:var(--acc);font-weight:600}
.dnav .toc a{padding:2px 8px 2px 18px;font-size:12px;color:var(--mut)}
.dnav .toc a.h3{padding-left:30px}
.md{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 24px 24px;min-width:0}
.md h1{font-size:22px;margin:16px 0 8px}.md h2{font-size:18px;margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.md h3{font-size:15px;margin:18px 0 6px}.md h4{font-size:14px;margin:14px 0 4px}
.md h1,.md h2,.md h3,.md h4{scroll-margin-top:70px}
.md code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
.md pre{background:var(--soft);padding:10px 12px;border-radius:8px;overflow:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--mut)}
.md ul,.md ol{padding-left:22px;margin:6px 0}.md li{margin:2px 0}.md li>ul,.md li>ol{margin:2px 0}
.md table{margin:8px 0}.md p{margin:8px 0}

/* 总览：统计卡 → 筛选胶囊 → 期卡片网格 */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{margin:0 0 4px;text-wrap:balance}.pagehead p{margin:0}
.crumb{font-size:12px;color:var(--mut);margin-bottom:2px}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--fg)}
.kpi .k{font-size:12px;letter-spacing:.04em;color:var(--c);font-weight:700}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border-radius:999px;padding:4px 13px;font-size:13px;color:var(--mut)}
.fchip b{font-weight:500;margin-left:5px;opacity:.8}
.fchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard2{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;color:var(--fg);transition:transform .15s,box-shadow .15s}
.pcard2:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.12)}
.pcard2 .cover{aspect-ratio:16/7;max-width:100%;position:relative;background:var(--soft);overflow:hidden}
.pcard2 .cover img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pcard2 .cover .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--line);letter-spacing:.1em}
.pcard2 .ctags{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.pcard2 .ctags .badge{box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pcard2 .pb{padding:12px 14px;display:grid;gap:6px;min-width:0}
.pcard2 h3{margin:0;font-size:15px;line-height:1.35}
.pcard2 .sum{color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard2 .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;overflow:hidden}
.pcard2 .meta .zero{color:var(--warn)}
.pcard2 .pf{border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;min-height:38px}
.pcard2 .pf .lt{margin-left:auto;font-size:11px;color:var(--mut)}
.st-已暂停2{color:var(--s4);background:var(--s4b)}
.card2{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card2>.bd{padding:12px 14px}
/* 手机 */
.phone{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.phone:last-child{border-bottom:0}
.phone .pi{width:20px;height:32px;border:2px solid var(--mut);border-radius:5px;position:relative}
.phone .pi::after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:2px;margin-left:-3px;background:currentColor;border-radius:2px;color:var(--mut)}
.phone.free .pi{border-color:var(--s3)}.phone.mine .pi{border-color:var(--s2)}.phone.busy .pi{border-color:var(--s1)}
.phone button{font-size:12px;padding:2px 9px}
/* 期页面：标签页 */
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 14px;overflow-x:auto}
.ptab{padding:9px 16px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.ptab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:500}
.ptab .n{font-size:11px;background:var(--soft);color:var(--mut);border-radius:999px;padding:0 7px;margin-left:5px}
.ptab .n.w{background:var(--s4b);color:var(--s4)}
.matgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;align-items:start}.matgrid .cat{margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start;margin-top:12px}
.stack{display:grid;gap:14px;min-width:0;align-content:start}
.stack>.q{margin:0}
.issbox .bd>details{margin-top:0!important}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.matgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.pcard2{transition:none}.pcard2:hover{transform:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="主导航">
  <a class="brand" href="#/"><i>KB</i>本地知识库</a>
  <div class="navh">工作台</div>
  <a class="nav" data-nav="/" href="#/"><span class="t">▦ 总览</span></a>

  <div class="plist" id="navPs"></div>
  <div class="navh">事项</div>
  <a class="nav" data-nav="/bugs" href="#/bugs" title="Bug 平台（禅道、Jira…）的 Bug：自动归到期，认不出的待归纳"><span class="t">🐞 Bug</span><span class="n" id="navBug"></span></a>
  <a class="nav" data-nav="/anr" href="#/anr" title="ANR / 崩溃：按堆栈合并、计数、mapping 还原"><span class="t">💥 ANR / 崩溃</span><span class="n" id="navAnr"></span></a>
  <div id="navEnt"></div>
  <div class="plist" id="navTs"></div>

</aside>
<div class="mainc">

  <form id="sf"><input type="text" id="q" placeholder="搜索需求、接口字段、设计说明、代码…"><select id="scope"><option value="all">全部</option><option value="docs">资料</option><option value="code">代码</option></select><button class="pri">搜索</button></form>
  <span class="sp"></span>
  <button id="addBtn" class="pri" title="模糊添加（随手粘贴网址 + 编号、几句需求、账号……交给 AI 判断放哪、怎么导入）或新建一期">＋ 添加</button>
</header>

<script>
const $=s=>document.querySelector(s), app=$('#app'), dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=encodeURIComponent;
const ORDER=['收集中','已批准开发','开发中','已完成','已暂停'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3500)}
async function api(u,opt){const r=await fetch(u,opt);const j=await r.json();if(!r.ok){const e=new Error(j.error||r.status);e.need=j.need;throw e}return j}
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const badge=s=>`<span class="badge st-${esc(s)}">${esc(s)}</span>`;
const fileUrl=p=>'/file?path='+enc(p);

let entries=[],ovPeriods=[];
let ovFilter='全部';try{ovFilter=localStorage.getItem('kb.ovFilter')||'全部'}catch(_){}
const DOT={收集中:'var(--s0)',已批准开发:'var(--info)',开发中:'var(--s2)',已完成:'var(--s3)',已暂停:'var(--s1)'};
// 左侧导航：期列表（状态色点 + 待确认 / 问题数）、手机空闲数、当前页高亮
// 侧边栏按分类折叠：每个分类标题点一下收起 / 展开，记在本机浏览器；收起的分类里有待确认 / 问题时标题后亮个点
let navFold={};try{navFold=JSON.parse(localStorage.getItem('kb.navFold')||'{}')}catch(_){}
(function navGroups(){
  const side=document.querySelector('.side');
  side.querySelectorAll(':scope>.navh').forEach(h=>{
    const b=document.createElement('div');b.className='navb';
    let n=h.nextElementSibling;while(n&&!n.classList.contains('navh')&&!n.classList.contains('foot')){const nx=n.nextElementSibling;b.appendChild(n);n=nx}
    h.after(b);const k=h.textContent.trim();h.dataset.g=k;h.insertAdjacentHTML('beforeend','<i class="hd"></i>');h.title='点击收起 / 展开';
    h.classList.toggle('fold',!!navFold[k]);
    h.onclick=()=>{navFold[k]=!navFold[k];if(!navFold[k])delete navFold[k];h.classList.toggle('fold',!!navFold[k]);try{localStorage.setItem('kb.navFold',JSON.stringify(navFold))}catch(_){}};
  });
})();
function navAlerts(){document.querySelectorAll('.side .navh').forEach(h=>{const b=h.nextElementSibling;h.classList.toggle('alert',!!(b&&b.querySelector('.n.w:not(:empty),.n.q:not(:empty)')))})}
function sideNav(d){
  if(d){periodNames=d.periods.filter(p=>p.kind!=='事项').map(p=>p.name);taskNames=d.periods.filter(p=>p.kind==='事项').map(p=>p.name);
    const navItem=p=>`<a class="nav" data-nav="/p/${esc(p.name)}" href="#/p/${enc(p.name)}" title="${esc(p.name)} · ${esc(p.status)}"><span class="d" style="background:${DOT[p.status]||'var(--s0)'}"></span><span class="t">${esc(p.name)}</span>${p.pendingQ?`<span class="n q">${p.pendingQ}</span>`:''}${p.issues?`<span class="n w">${p.issues}</span>`:''}</a>`;
    $('#navPs').innerHTML=d.periods.filter(p=>p.kind!=='事项').map(navItem).join('');
    $('#navTs').innerHTML=d.periods.filter(p=>p.kind==='事项'&&p.status!=='已完成'&&!(p.plugins||[]).length).map(navItem).join('')||'<span class="mut small" style="padding:4px 12px;display:block">没有进行中的事项</span>';
    $('#navPh').textContent=d.phones?`${d.phones.free}/${d.phones.total}`:'';
    const nb=$('#navBug');nb.textContent=d.zentao&&d.zentao.pending?d.zentao.pending:'';nb.title='待归纳（未关闭）';nb.classList.toggle('w',!!(d.zentao&&d.zentao.pending));
    entries=d.entries||[];ovPeriods=d.periods;
    $('#navEnt').innerHTML=entries.map(x=>{const ts=d.periods.filter(p=>(p.plugins||[]).includes(x.id)&&p.status!=='已完成'),q=ts.reduce((a,p)=>a+(p.pendingQ||0),0);
      return `<a class="nav" data-nav="/tool/${esc(x.id)}" href="#/tool/${enc(x.id)}" title="${esc(x['说明']||'')}${ts.length?' · 待解决 '+ts.length+' 条':''}"><span class="t">${esc(x['图标'])} ${esc(x['名称'])}</span>${q?`<span class="n q" title="${q} 个待你确认">${q}</span>`:ts.length?`<span class="n">${ts.length}</span>`:''}</a>`}).join('');
    const na=$('#navAnr'),at=d.anr?d.anr.todo:0;na.textContent=at||'';na.title='待处理：没关联事项，或事项完成后又出现';na.classList.toggle('w',!!at)}
  const h=decodeURIComponent(location.hash.slice(1)||'/');
  const pt=h.startsWith('/p/')&&ovPeriods.find(p=>p.name===h.slice(3)&&(p.plugins||[]).length),hh=pt?'/tool/'+pt.plugins[0]:h;
  document.querySelectorAll('.side .nav').forEach(a=>{const k=a.dataset.nav;a.classList.toggle('on',k==='/'?hh==='/':k==='/d/'?hh.startsWith('/d/'):hh===k)});
  navAlerts();
}
async function navRefresh(){try{sideNav(await api('/api/overview'))}catch(_){}}

async function overview(){
  const d=await api('/api/overview');
  try{d.adds=(await api('/api/adds')).items}catch(_){d.adds=[]}
  sideNav(d);
  const tasks=d.periods.filter(p=>p.kind==='事项');d.periods=d.periods.filter(p=>p.kind!=='事项');
  const cnt=s=>d.periods.filter(p=>s==='全部'||p.status===s).length;
  const sum=k=>d.periods.concat(tasks).reduce((a,p)=>a+(p[k]||0),0);
  const list=d.periods.filter(p=>ovFilter==='全部'||p.status===ovFilter);
  const tag=(cls,t,tip)=>`<span class="badge ${cls}"${tip?` title="${esc(tip)}"`:''}>${t}</span>`;
  const card=p=>`<a class="pcard2" href="#/p/${enc(p.name)}">
    <div class="cover">${p.cover?`<img loading="lazy" src="${fileUrl(p.cover)}" alt="">`:`<div class="ph">${esc((p.name.split('-').slice(1).join('-')||p.name).slice(0,8))}</div>`}
      <div class="ctags">${badge(p.status)}${p.running?'<span class="badge st-开发中">● 后台开发中</span>':''}</div></div>
    <div class="pb"><h3>${esc(p.name)}</h3><div class="sum">${esc(p.summary||'（没有简介）')}</div>
      <div class="meta">${d.cats.map(c=>`<span class="${p.counts[c]?'':'zero'}">${c} ${p.counts[c]}</span>`).join('')}<span class="${p.designImages?'':'zero'}">设计稿 ${p.designImages}</span></div>
      ${p.branches&&p.branches.length?`<div class="meta mono" title="开发分支">🌿 ${esc(p.branches.join('；'))}</div>`:''}</div>
    <div class="pf">${p.pendingQ?tag('st-已批准开发',`🔔 ${p.pendingQ} 个待确认`):''}${p.issues?tag('st-已暂停2',`⚠ ${p.issues} 个问题`,'不阻断开发、但要你处理的问题（手机不够、缺账号等）'):''}
      ${p.bugs?`<span class="badge st-开发中" title="归到这一期、未关闭的 Bug">🐞 ${p.bugs}</span>`:''}${p.retest?tag('st-收集中',`🔁 ${p.autoRetest?'等条件自动复测':'可复测'}`):''}${p.dnd?tag('st-收集中','🌙 免打扰'):''}
      ${p.sources?tag(p.pendingSources?'st-已暂停2':'st-收集中',`来源 ${p.sources}${p.pendingSources?' · '+p.pendingSources+' 待核对':' · 已核对'}`):''}
      ${p.staleSources?tag('st-已暂停2',`⚠ ${p.staleSources} 条原文有变化`):''}${p.imagesWithoutNote?tag('st-已暂停2',`${p.imagesWithoutNote} 张图无说明`):''}
      <span class="lt">${p.lastLog?esc(p.lastLog.time):''}</span></div></a>`;
  const ph=d.phones;
  app.innerHTML=`
  <div class="pagehead"><div><h1>总览</h1><p class="mut">按「期」管理需求、设计稿、接口文档和零散资料；资料齐了就在期里一键开始开发。</p></div>
    <div class="mut small">${d.zentao&&d.zentao.open?`<a href="#/bugs">🐞 Bug ${d.zentao.open}${d.zentao.pending?` · <b style="color:var(--s1)">${d.zentao.pending} 待归纳</b>`:''}</a> · `:''}已索引资料 ${d.docs} · 代码仓库 ${d.repos.length}${d.inbox.length?` · <b style="color:var(--s1)">收件箱 ${d.inbox.length} 个待整理</b>`:''}</div></div>
  <section class="kpis">
    <div class="kpi" style="--c:var(--s2)"><div><div class="k">开发中</div><div class="v">${cnt('开发中')}</div></div><span class="mut small">已批准待开工 ${cnt('已批准开发')}</span></div>
    <div class="kpi" style="--c:var(--s1)"><div><div class="k">待你确认</div><div class="v">${sum('pendingQ')}</div></div></div>
    <div class="kpi" style="--c:var(--s4)"><div><div class="k">需要你处理的问题</div><div class="v">${sum('issues')}</div></div><span class="mut small">手机、账号、环境等</span></div>
    <a class="kpi" href="#/phones" style="--c:var(--s3)"><div><div class="k">空闲手机</div><div class="v">${ph?ph.free+' / '+ph.total:'—'}</div></div><span class="mut small">${ph?'多个期共用':'本机找不到 adb'}</span></a>
  </section>
  <div class="fchips">${['全部',...ORDER].map(s=>`<button class="fchip ${s===ovFilter?'on':''}" data-f="${s}">${s}<b>${cnt(s)}</b></button>`).join('')}</div>
  <section class="pgrid">${list.map(card).join('')||'<p class="mut">这个状态下还没有期。</p>'}</section>
  <div class="row" style="justify-content:space-between;margin-top:22px"><h2 style="margin:0">事项 <span class="mut small" style="font-weight:400">不是产品需求、但要推动的工作：用户上报的 ANR、加埋点、线上问题、优化、调研、其他</span></h2><button id="ovTask">＋ 新建事项</button></div>
  ${taskTable(tasks)}
  ${d.adds&&d.adds.length?`<h2>模糊添加 <a class="small" id="ovAdd" style="font-weight:normal">查看全部</a></h2>${d.adds.slice(0,3).map(addRec).join('')}`:''}
  ${d.inbox.length?`<h2>收件箱（${d.inbox.length}）</h2>
  <div class="cat"><div class="bd"><ul class="files">${d.inbox.map(f=>`<li><span>${esc(f.name)}${f.isDir?'/':''}</span><span class="mut small">${size(f.size)}</span></li>`).join('')}</ul>
  <div class="row" style="margin-top:8px">归档到 <select id="ibP">${d.periods.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><button class="pri" id="ibGo">自动分类归档</button></div></div></div>`:''}
  <h2>代码仓库</h2>
  ${d.repos.length?`<div class="tw"><table><tr><th>名称</th><th>路径</th><th>已索引文件</th><th>登记时间</th></tr>${d.repos.map(r=>`<tr><td>${esc(r.name)}</td><td class="small mono">${esc(r.path)}</td><td>${r.files}</td><td class="small">${esc(r.added)}</td></tr>`).join('')}</table></div>`:'<p class="mut">还没有登记。终端运行 <code>kb repo &lt;代码路径&gt;</code>，或让 Claude 登记。</p>'}
  <p class="mut small">知识库目录：${esc(d.root)}　·　<a href="#/d/使用说明">使用说明</a></p>`;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ovFilter=b.dataset.f;try{localStorage.setItem('kb.ovFilter',ovFilter)}catch(_){}overview()});
  if($('#ovAdd'))$('#ovAdd').onclick=()=>addDlg();
  $('#ovTask').onclick=()=>addDlg('task');
  const g=$('#ibGo');if(g)g.onclick=async()=>{try{const r=await post('/api/inbox',{period:$('#ibP').value});toast(r.msg);render()}catch(e){toast(e.message)}};
}

// 手机：所有期共用，谁在用、哪个分支
async function phonesPage(){
  const r=await api('/api/devices');navRefresh();
  app.innerHTML=`<div class="pagehead"><div><h1>手机</h1><p class="mut">所有期共用的手机。后台会话只会往申请到的手机装包、操作，不会碰别的期占着的；你自己要用就点「我在用」（4 小时内后台不碰它）。</p></div></div>
  <div class="card2"><div class="bd" id="phList">${r.items?phoneRows(r.items,''):'<span class="mut">本机找不到 adb：装好 Android SDK platform-tools 后刷新。</span>'}</div></div>`;
  bindPhones(app,()=>phonesPage());
}
const phoneRows=(items,period)=>items.length?items.map(x=>{const c=x['占用'],cls=x['空闲']?'free':!c?'':c['方式']==='本人'||x['本期']?'mine':'busy';
  const st=x['空闲']?'空闲':!c?esc(x['状态']):(c['方式']==='本人'?'本人在用':x['本期']?'本期占用':`「${esc(c['期'])}」占用${c['分支']?' · 分支 <span class="mono">'+esc(c['分支'])+'</span>':''}`)+` · 最后使用 ${esc(c['最后使用'])}${x['状态']!=='在线'?' · '+esc(x['状态']):''}`;
  return `<div class="phone ${cls}"><span class="pi"></span><div style="min-width:0"><div><b>${esc(x['型号']||'未知型号')}</b> <span class="mono mut">${esc(x['序列号'])}</span></div>
    <div class="small mut">${st}${x['agent-device']?` · agent-device 会话 ${esc(x['agent-device']['会话'])}${x['agent-device']['期']?'（'+esc(x['agent-device']['期'])+'）':''}`:''}</div></div>
    ${c?`<button class="small" data-dm="release" data-sn="${esc(x['序列号'])}" title="解除占用（后台会话还在用的话，它下次操作会重新占用）">释放</button>`:x['空闲']?`<button class="small" data-dm="mine" data-sn="${esc(x['序列号'])}" title="你自己要用这台手机：4 小时内后台会话不会往它装包、操作">我在用</button>`:'<span></span>'}</div>`}).join(''):'<div class="small mut">没有连着的手机</div>';
function bindPhones(root,after){root.querySelectorAll('[data-dm]').forEach(b=>b.onclick=async()=>{
  if(b.dataset.dm==='release'&&!confirm(`解除 ${b.dataset.sn} 的占用？`))return;
  try{const r=await post('/api/device',{serial:b.dataset.sn,action:b.dataset.dm});toast(r.msg);after()}catch(e){toast(e.message)}})}

const size=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(0)+' KB':n+' B';
const when=t=>new Date(t*1000).toLocaleString('zh-CN',{hour12:false}).slice(0,16);

let ptabs={};try{ptabs=JSON.parse(localStorage.getItem('kb.ptabs')||'{}')}catch(_){}
// ---- 事项：和期一样的资料 / 确认 / 开发能力，默认轻量流程，单独列出
let taskNames=[];
const PRI_C={高:'st-已暂停2',中:'st-收集中',低:'st-已完成'};
function taskTable(ts){
  if(!ts.length)return '<p class="mut">还没有事项。用户上报的 ANR、要加的埋点、线上问题……点「＋ 新建事项」，或在 🐞 Bug 页把待归纳的 Bug 归入事项。</p>';
  const open=ts.filter(t=>t.status!=='已完成'),done=ts.filter(t=>t.status==='已完成');
  const row=t=>`<tr><td><a href="#/p/${enc(t.name)}"><b>${esc(t.name)}</b></a><div class="mut small">${esc(t.summary||'')}</div></td>
    <td><span class="badge st-收集中">${esc(t.taskKind||'其他')}</span></td><td><span class="badge ${PRI_C[t.priority]||''}">${esc(t.priority||'中')}</span></td>
    <td>${badge(t.status)}${t.running?' <span class="badge st-开发中">● 处理中</span>':''}${t.pendingQ?` <span class="badge st-已批准开发">🔔 ${t.pendingQ}</span>`:''}</td>
    <td>${t.bugs?`🐞 ${t.bugs}`:''}</td><td class="small mut">${esc(t.from||'')}</td><td class="small mut">${esc(t.lastLog?t.lastLog.time:t.created)}</td></tr>`;
  const head='<tr><th>事项</th><th style="width:96px">类型</th><th style="width:72px">优先级</th><th style="width:170px">状态</th><th style="width:60px">Bug</th><th style="width:150px">来自</th><th style="width:130px">最近</th></tr>';
  const order=a=>a.slice().sort((x,y)=>(['高','中','低'].indexOf(x.priority)-['高','中','低'].indexOf(y.priority))||String(y.updated||'').localeCompare(String(x.updated||'')));
  return `<div class="tw"><table>${head}${order(open).map(row).join('')||'<tr><td colspan="7" class="mut">没有进行中的事项</td></tr>'}</table></div>
    ${done.length?`<details style="margin-top:6px"><summary class="small mut">已完成 ${done.length}</summary><div class="tw"><table>${head}${done.map(row).join('')}</table></div></details>`:''}`}

async function period(name){

  const isTask=m['类型']==='事项';
  if(isTask&&(m['外部来源']||[]).length&&!fullView[d.name])return pushPage(d);
  const hist=m['状态历史']||[];
  const lastAt=s=>{for(let i=hist.length-1;i>=0;i--)if(hist[i]['状态']===s)return hist[i]['时间'];return''};
  const flow=['收集中','已批准开发','开发中','已完成'], ci=flow.indexOf(m['状态']);
  const steps=flow.map((s,i)=>`<div class="step ${i<ci?'done':i===ci?'cur':''}">${s}<small>${esc(lastAt(s))}</small></div>`).join('');
  const hasDesign=d.materials['设计图'].some(f=>f.isImage||(f.isDir&&f.images&&f.images.length));
  const missing=d.cats.filter(c=>c!=='其他资料'&&c!=='设计图'&&!d.materials[c].length&&!d.notes[c].length).concat(hasDesign?[]:['设计稿（Figma / 蓝湖）']);
  let notice='';
  if(m['状态']==='收集中'&&isTask)notice=`<div class="notice"><span>把现象、日志 / traces、截图、用户反馈拖进「资料」，或在 🐞 Bug 页把相关 Bug 归进来；准备好后在「开发」里点「开始开发」（按轻量流程：定位 → 确认改法 → 修改自测 → 写结论）。</span></div>`;

  const catBox=c=>{

      ${ns.map(noteCard).join('')}
      ${imgs.length?`<div class="grid">${imgs.map(f=>`<div class="thumb" data-img="${esc(f.path)}"><img loading="lazy" src="${fileUrl(f.path)}"><div class="${f.note?'':'nonote'}" title="${esc(f.note)}">${esc(f.name)}${f.note?'':' · 无说明'}</div></div>`).join('')}</div>`:''}

        <div class="grid" style="margin-top:6px">${f.images.map(p=>`<div class="thumb" data-img="${esc(p)}" data-note="${esc((f.notes||{})[p]||'')}"><img loading="lazy" src="${fileUrl(p)}"><div title="${esc((f.notes||{})[p]||'')}">${esc(p.split('/').pop())}</div></div>`).join('')}</div></details>`).join('')}

      <h1>${esc(d.name)} ${badge(m['状态'])}${isTask?` <span class="badge st-收集中">${esc(m['事项类型']||'其他')}</span> <span class="badge ${PRI_C[m['优先级']]||''}">优先级 ${esc(m['优先级']||'中')}</span>`:''}</h1><div class="mut">${esc(m['说明']||'')}${isTask&&m['来自']?`　<span class="small">来自：${esc(m['来自'])}</span>`:''}${isTask?` <a class="small" id="tkEdit">✎ 编辑</a>`:''}</div>
      <div class="pmeta">${branches.length?`<span>🌿 开发分支 ${branches.map(n=>`<b class="mono">${esc(noteTitle(n))}</b>`).join('；')}</span>`:''}

    <nav class="ptabs">${tabs.map(([k,t,n])=>`<a class="ptab ${k===tab?'on':''}" data-tab="${k}">${t}${n?`<span class="n${k==='dev'&&n?' w':''}">${n}</span>`:''}${k==='mat'&&pend?`<span class="n w" title="来源核对">${pend} 待核对</span>`:''}</a>`).join('')}</nav>

      <div class="matgrid">${d.cats.map(catBox).join('')}</div></div>

function bindDrop(z,p,c){
  const pick=document.createElement('input');pick.type='file';pick.multiple=true;
  z.onclick=()=>pick.click();pick.onchange=()=>upload([...pick.files],p,c);
  z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');
  z.ondrop=async e=>{e.preventDefault();z.classList.remove('over');const fs=[...e.dataTransfer.files];
    if(fs.length)return upload(fs,p,c);
    const u=(e.dataTransfer.getData('text/uri-list')||'').split('\n').find(x=>x&&!x.startsWith('#'))||'', t=e.dataTransfer.getData('text/plain')||'';
    if(!u&&!t.trim())return;
    try{const r=await post('/api/note',{period:p,category:c,content:u&&t.trim()===u?'':t,url:u});toast(r.msg.split('\n')[0]);render();askReplace(p,r)}catch(err){toast(err.message)}};

  render();
}

// 轻量 Markdown 渲染：标题、列表（可嵌套）、表格、代码块、引用、行内代码 / 粗体 / 链接
function mdInline(t){
  const codes=[];t=esc(t).replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
     .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,a,u)=>`<a href="${u}" target="_blank" rel="noopener">${a}</a>`)
     .replace(/(^|[\s（(：:])(https?:\/\/[^\s<）)，。]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${codes[i]}</code>`);
}
function md(src){
  const L=src.replace(/\r/g,'').split('\n'),out=[],toc=[];let i=0;
  const isList=l=>/^\s*([-*+]|\d+\.)\s+/.test(l);
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){const b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push(`<pre><code>${esc(b.join('\n'))}</code></pre>`);continue}
    let m=l.match(/^(#{1,4})\s+(.*)$/);
    if(m){const n=m[1].length,id='h'+toc.length;toc.push({n,id,t:m[2].replace(/[`*]/g,'')});out.push(`<h${n} id="${id}">${mdInline(m[2])}</h${n}>`);i++;continue}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){out.push('<hr>');i++;continue}
    if(/^>/.test(l)){const b=[];while(i<L.length&&/^>/.test(L[i]))b.push(L[i++].replace(/^>\s?/,''));out.push(`<blockquote>${b.map(mdInline).join('<br>')}</blockquote>`);continue}
    if(/^\|/.test(l)&&i+1<L.length&&/^\|?\s*:?-+/.test(L[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>mdInline(c.trim().replace(/\\\|/g,'|')));
      const h=row(l);i+=2;const rs=[];while(i<L.length&&/^\|/.test(L[i]))rs.push(row(L[i++]));
      out.push(`<div class="tw"><table><tr>${h.map(c=>`<th>${c}</th>`).join('')}</tr>${rs.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`);continue}
    if(isList(l)){
      const items=[];while(i<L.length&&(isList(L[i])||(/^\s{2,}\S/.test(L[i])&&items.length))){
        const mm=L[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        if(mm)items.push({d:Math.floor(mm[1].length/2),o:/\d/.test(mm[2]),t:mm[3]});else items[items.length-1].t+=' '+L[i].trim();i++}
      let h='',st=[];
      for(const it of items){
        while(st.length>it.d+1)h+=`</li></${st.pop()}>`;
        if(st.length<it.d+1){const tg=it.o?'ol':'ul';h+=`<${tg}>`;st.push(tg)}else h+='</li>';
        h+=`<li>${mdInline(it.t)}`}
      while(st.length)h+=`</li></${st.pop()}>`;out.push(h);continue}
    if(!l.trim()){i++;continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|```|>|\|)/.test(L[i])&&!isList(L[i]))p.push(L[i++]);
    out.push(`<p>${p.map(mdInline).join('<br>')}</p>`);
  }
  return {html:out.join('\n'),toc};
}

// 开始开发：仓库、分支自动判断；判断不了时弹窗让本人选，选完带着选择重新开始
async function devStart(body){
  try{const r=await post('/api/dev/start',body);dlg.close();toast(r.msg);render()}
  catch(e){if(!e.need)throw e;needDlg(body,e.need)}
}
function needDlg(body,n){
  const radio=(v,label,dis,chk)=>`<label class="row" style="align-items:flex-start;margin:4px 0;${dis?'opacity:.55':''}"><input type="radio" name="nd" value="${esc(v)}" ${dis?'disabled':''} ${chk?'checked':''}><span>${label}</span></label>`;
  let h;
  if(n['需要']==='仓库'){
    const cs=n['候选']||[],first=cs.findIndex(x=>x['可用']);
    h=`<p>${esc(n['说明']||(cs.length?'找到多个可能的代码仓库，确定不了用哪个，请选一个：':'本期文字资料里没有找到本机代码路径，请填写：'))}</p>
      ${cs.map((x,i)=>radio(x['路径'],`<code>${esc(x['路径'])}</code>　<span class="mut small">当前分支 ${esc(x['当前分支']||'—')} · 来自 ${esc(x['依据'].join('、'))} · ${x['可用']?'流程 '+esc(x['流程']):'没有匹配的开发流程（可在开发面板换流程）'}</span>`,!x['可用'],i===first)).join('')}
      ${radio('*','其他路径　<input type="text" id="ndP" style="width:420px" placeholder="/Users/…/代码仓库根目录">',false,first<0)}
      ${n['分支']&&n['分支'].length?`<p class="mut small">本期登记的开发分支：${esc(n['分支'].join('、'))}</p>`:''}
      <p class="mut small">选定后会记在这一期，下次开始开发直接使用。</p>`;
  }else{
    const dirty=n['未提交数']||0;
    h=`<p>仓库 <code>${esc(n['仓库'])}</code> 当前在分支 <b>${esc(n['当前分支']||'（游离）')}</b>，本期登记的开发分支是 <b>${esc(n['分支'].join('、'))}</b>。SDD 文档目录按分支名生成，请确认：</p>
      ${n['分支'].map((b,i)=>radio('sw:'+b,`切换到 <b>${esc(b)}</b>　<span class="mut small">切换前在当前分支、切换后在新分支各执行一次 <code>git pull --rebase</code>；本地没有会从 origin 拉取，两边都没有会提示你先建好</span>`,dirty>0,i===0&&!dirty)).join('')}
      ${radio('sw:*','切换到其他分支　<input type="text" id="ndB" style="width:340px" placeholder="分支名">',dirty>0,false)}
      ${radio('keep','就用当前分支 <b>'+esc(n['当前分支'])+'</b> 开发　<span class="mut small">先执行一次 <code>git pull --rebase</code></span>',!!dirty,false)}
      ${dirty?`<div class="notice small" style="display:block">已跟踪的文件有 ${dirty} 处未提交的改动，<code>git pull --rebase</code> 拉不了代码，也不能切分支。请先在仓库里提交或 stash，再回来点「开始开发」：<pre style="margin:6px 0 0">${esc(n['未提交'].join('\n'))}</pre></div>`:''}`;
  }
  openDlg(n['需要']==='仓库'?'选择开发仓库':'确认开发分支',`<div>${h}<div class="row" style="margin-top:10px"><button class="pri" id="ndGo">继续开始开发</button><button onclick="dlg.close()">取消</button></div></div>`);
  $('#dlgB').querySelectorAll('input[type=text]').forEach(t=>t.onfocus=()=>{t.closest('label').querySelector('input[type=radio]').checked=true});
  $('#ndGo').onclick=async()=>{
    const v=($('#dlgB').querySelector('input[name=nd]:checked')||{}).value;if(!v)return toast('请选一项');
    const b={...body};
    if(n['需要']==='仓库'){b.repo=v==='*'?$('#ndP').value.trim():v;if(!b.repo)return toast('请填写代码路径')}
    else{b.repo=n['仓库'];if(v==='keep')b.keepBranch=true;else{b.branch=v==='sw:*'?$('#ndB').value.trim():v.slice(3);if(!b.branch)return toast('请填写分支名')}}
    const g=$('#ndGo');g.disabled=true;g.textContent='处理中…';
    try{await devStart(b)}catch(e){toast(e.message);g.disabled=false;g.textContent='继续开始开发'}};
}

function rawGroups(ms){   // 连续几条只有工具调用、没有文字的，合成一条折叠
  const out=[];for(const m of ms){const only=m['角色']!=='用户'&&m['角色']!=='摘要'&&!m['内容']&&(m['工具']||[]).length;
    if(only){const l=out[out.length-1];if(l&&l.steps)l.steps.push(m);else out.push({steps:[m]})}else out.push(m)}
  return out}
function rawView(c){
  const tl=t=>t['工具']?`<div><b>🔧 ${esc(t['工具'])}</b> <span class="mut">${esc(t['参数']||'')}</span>${t['结果']?`<pre>${esc(t['结果'])}</pre>`:''}</div>`:'';
  return `<div class="raw">${(c['会话']||[]).map((x,i)=>`${i?'<hr>':''}<div class="small mut">${esc(x['编号'])} · ${esc(x['来源']||'')}${x['提问人']?' · 提问人 '+esc(x['提问人']):''} · 最近 ${esc(x['时间']||'')} · ${x['消息数']||0} 条消息　<a href="${esc(x['地址'])}" target="_blank" rel="noopener">在原系统打开 ↗</a></div>

      :m['角色']==='摘要'?`<details class="msg"><summary class="who">上下文压缩前的摘要 · ${esc(m['时间'])}</summary><div class="md">${md(m['内容']).html}</div></details>`
      :`<div class="msg ${m['角色']==='用户'?'u':''}"><div class="who">${m['角色']==='用户'?'👤 用户':'🤖 '+esc(m['角色'])} · ${esc(m['时间'])}</div>

async function pushBox(name){
  const box=$('#pushBox');if(!box)return;
  let v;try{v=await api('/api/dev?name='+enc(name))}catch(e){box.innerHTML='';return}
  if(!$('#pushBox'))return;
  const sig=JSON.stringify([v['会话'],v['待确认'],v['动作'].slice(-6)]);if(box.dataset.sig===sig)return;
  if(box.dataset.sig&&document.activeElement&&box.contains(document.activeElement)&&document.activeElement.matches('textarea'))return;
  const s=v['会话'],run=s&&s['状态']==='运行中',pend=v['待确认'].filter(q=>q['状态']==='待回答');
  const go=$('#puGo');if(go){go.textContent=run?'发给正在推动的 AI':'分析推动'}
  box.innerHTML=(s?`<div class="small" style="margin-top:10px">${run?`<span class="badge st-开发中">● 推动中</span> 已运行 <span data-since="${esc(s['开始时间'])}">${since(s['开始时间'])}</span> · ${esc((s['仓库']||'').split('/').pop())} ${esc(s['分支']||'')}　<a id="puStop" style="color:var(--s4)">停止</a>`
      :`<span class="badge st-${s['退出码']?'已暂停':'已完成'}">上次推动${esc(s['状态'])}</span> <span class="mut">${esc(s['结束时间']||'')}</span>`}</div>`:'')
    +pend.map(q=>`<div class="q" data-q="${esc(q['编号'])}"><div style="font-weight:600">🔔 ${esc(q['问题'])}</div>${q['背景']?`<div class="ctx md">${md(q['背景']).html}</div>`:''}
      ${q['AI建议']?`<div class="small">AI 建议：<b>${esc(q['AI建议'])}</b></div>`:''}<div class="opts">${q['选项'].map((o,i)=>`<button data-opt="${i}">${esc(o)}</button>`).join('')}${q['AI建议']?'<button data-ai="1">采用 AI 建议</button>':''}</div>
      <textarea rows="2" placeholder="你的回答（Cmd+Enter 提交）">${esc(drafts[q['编号']]||'')}</textarea><div class="row" style="margin-top:6px"><button class="pri" data-ans="1">提交回答</button></div></div>`).join('')
    +(v['动作'].length?`<details style="margin-top:8px" ${run?'open':''}><summary class="small mut">最近动作</summary><div class="act">${v['动作'].slice(-8).reverse().map(actLine).join('')}</div></details>`:'');
  box.dataset.sig=sig;
  const st=$('#puStop');if(st)st.onclick=async()=>{if(!confirm('停止正在推动的后台 AI？'))return;try{toast((await post('/api/dev/stop',{period:name})).msg);pushBox(name)}catch(e){toast(e.message)}};
  box.querySelectorAll('.q').forEach(el=>{const id=el.dataset.q,ta=el.querySelector('textarea'),q=pend.find(x=>x['编号']===id);
    ta.oninput=()=>drafts[id]=ta.value;
    el.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{ta.value=q['选项'][+b.dataset.opt];drafts[id]=ta.value;ta.focus()});
    const ai=el.querySelector('[data-ai]');if(ai)ai.onclick=()=>{ta.value=q['AI建议'];drafts[id]=ta.value;ta.focus()};
    const ok=async()=>{try{toast((await post('/api/answer',{period:name,id,answer:ta.value})).msg);delete drafts[id];box.dataset.sig='';pushBox(name)}catch(e){toast(e.message)}};
    el.querySelector('[data-ans]').onclick=ok;ta.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))ok()}});
}

  app.querySelectorAll('[data-eln]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{toast((await post('/api/engine/link',{id:b.dataset.eln})).msg);render()}catch(e){toast(e.message);b.disabled=false}});
  app.querySelectorAll('[data-ehp]').forEach(b=>b.onclick=()=>{const e=eById(b.dataset.ehp);openDlg(`把知识库接入 ${e['名称']}`,`<pre style="white-space:pre-wrap">${esc(e['接入说明'])}</pre><button id="ehC">复制</button>`);$('#ehC').onclick=()=>{navigator.clipboard.writeText(e['接入说明']);toast('已复制')}});
  app.querySelectorAll('[data-ets]').forEach(b=>b.onclick=async()=>{const e=eById(b.dataset.ets);b.disabled=true;b.textContent='测试中…';
    try{const r=await post('/api/engine/test',{id:e.id});openDlg(`测试 ${e['名称']}：${r['成功']?'✅ 成功':'❌ 没通过'}`,`<p class="small mut">退出码 ${r['退出码']} · 用时 ${r['耗时']} 秒</p><pre style="white-space:pre-wrap">${esc(r['结果']||'（没有输出）')}</pre>${r['成功']?'':'<p class="small">没通过时：确认已安装、已登录，「接入知识库」后再试；仍不行就检查启动参数（权限模式是否允许调用知识库工具）。</p>'}`)}
    catch(e){toast(e.message)}b.disabled=false;b.textContent='测试'});
  app.querySelectorAll('[data-erm]').forEach(b=>b.onclick=async()=>{const e=eById(b.dataset.erm);
    if(!confirm(e['内置']?`把「${e['名称']}」恢复为默认设置？`:`删除引擎「${e['名称']}」？用它的期会改回默认引擎。`))return;
    try{toast((await post('/api/engine/delete',{id:e.id})).msg);render()}catch(x){toast(x.message)}});
  app.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>flowDlg(d,byId(b.dataset.ed)));
  app.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const f={...byId(b.dataset.cp)};['id','内置','已修改','默认'].forEach(k=>delete f[k]);f['名称']+='（副本）';flowDlg(d,f)});
  app.querySelectorAll('[data-df]').forEach(b=>b.onclick=async()=>{try{toast((await post('/api/settings/default',{id:b.dataset.df})).msg);render()}catch(e){toast(e.message)}});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const f=byId(b.dataset.rm);
    if(!confirm(f['内置']?`把「${f['名称']}」恢复为内置的默认设置？你的修改会丢失。`:`删除流程「${f['名称']}」？用它的期会改回「自动」。`))return;
    try{toast((await post('/api/settings/flow/delete',{id:f.id})).msg);render()}catch(e){toast(e.message)}});
  app.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{const f={...byId(b.dataset.ex)};['id','内置','已修改','默认'].forEach(k=>delete f[k]);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(f,null,2)],{type:'application/json'}));a.download=`开发流程-${f['名称']}.json`;a.click()});
  $('#flNew').onclick=()=>{const f={...d.flows.find(x=>x.id==='generic')};['id','内置','已修改','默认'].forEach(k=>delete f[k]);f['名称']='';f['说明']='';flowDlg(d,f)};
  $('#flCmd').onclick=()=>cmdDlg(d);
  $('#flImp').onclick=()=>{openDlg('导入开发流程',`<div style="display:grid;gap:8px"><input type="file" id="fiF" accept=".json,application/json"><textarea id="fiT" rows="10" placeholder="或粘贴导出的 JSON"></textarea><button class="pri" id="fiGo">导入为新流程</button></div>`);
    $('#fiF').onchange=async e=>{const x=e.target.files[0];if(x)$('#fiT').value=await x.text()};
    $('#fiGo').onclick=async()=>{let f;try{f=JSON.parse($('#fiT').value)}catch(_){return toast('不是有效的 JSON')}
      delete f.id;try{const r=await post('/api/settings/flow',{flow:f});dlg.close();toast(r.msg);render()}catch(e){toast(e.message)}}};
}
function engineDlg(d,e){
  const fld=([k,lab,typ,help])=>{const v=e[k]??'';let inp;
    if(typ==='textarea')inp=`<textarea data-k="${k}" rows="3">${esc(v)}</textarea>`;
    else if(typ==='lines')inp=`<textarea data-k="${k}" rows="6" style="font-family:monospace">${esc((v||[]).join('\n'))}</textarea>`;
    else if(typ.startsWith('select:'))inp=`<select data-k="${k}">${typ.slice(7).split('|').map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else inp=`<input type="text" data-k="${k}" value="${esc(v)}" style="width:100%">`;
    return `<label style="display:block"><b class="small">${esc(lab)}</b>${inp}<div class="small mut">${esc(help)}</div></label>`};
  openDlg(e.id?`编辑 AI 引擎：${e['名称']}`:'新建 AI 引擎',`<div style="display:grid;gap:10px">
    ${e['内置']?'<div class="notice small" style="display:block">这是内置引擎：保存后存为你的修改，随时可在设置页「恢复默认」。</div>':''}
    ${d.engineFields.map(fld).join('')}
    <div class="small mut">参数里可用变量：${Object.entries(d.engineVars).map(([k,v])=>`<code>{${esc(k)}}</code> ${esc(v)}`).join('；')}。参数逐个传给命令，不经过 shell。</div>
    <div class="row"><button class="pri" id="enGo">保存</button></div></div>`);
  $('#enGo').onclick=async()=>{const o={id:e.id||''};$('#dlgB').querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value);
    try{const r=await post('/api/engine',{engine:o});dlg.close();toast(r.msg);render()}catch(x){toast(x.message)}};
}
async function cmdDlg(d){
  openDlg('从命令 / 技能添加开发流程','<span class="mut small">正在查找本机的技能和命令…</span>');
  let cs;try{cs=(await api('/api/settings/commands')).items}catch(e){return $('#dlgB').textContent=e.message}
  const row=(c,i)=>`<label class="row cmdrow" data-t="${esc((c['名称']+' '+c['说明']+' '+c['类型']).toLowerCase())}" style="align-items:flex-start;margin:2px 0"><input type="radio" name="cm" value="${i}">
    <span><b>${esc(c['名称'])}</b> <span class="chip">${esc(c['类型'])}</span><br><span class="small mut">${esc(c['说明']||'')}</span></span></label>`;
  $('#dlgB').innerHTML=`<div style="display:grid;gap:8px">
    <p class="small mut" style="margin:0">选中你平时用来开发的命令或技能（如 <code>/my-flow</code>），自动生成一套开发流程，生成后可以再改。
    个人技能 / 命令任何仓库都能用；仓库里的命令只匹配带这个命令的仓库。</p>
    <input type="text" id="cmQ" placeholder="搜索，如 plan、sdd">
    <div id="cmL" style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px">${cs.map(row).join('')||'<span class="mut">没有找到技能或命令</span>'}</div>
    <div class="row"><button class="pri" id="cmAI" title="Claude 读说明文件，按它的实际做法填好文档目录、步骤、确认点、进度（约 1 分钟）">让 Claude 读说明生成（推荐）</button>
      <button id="cmQk" title="按固定模板填写，不调用 AI">快速生成</button><span class="mut small" id="cmS"></span></div></div>`;
  $('#cmQ').oninput=()=>{const q=$('#cmQ').value.trim().toLowerCase();$('#cmL').querySelectorAll('.cmdrow').forEach(x=>x.style.display=!q||x.dataset.t.includes(q)?'':'none')};
  $('#cmQ').focus();
  const go=async ai=>{const v=($('#cmL').querySelector('input[name=cm]:checked')||{}).value;if(v===undefined)return toast('先选一个命令或技能');
    const bs=[$('#cmAI'),$('#cmQk')];bs.forEach(b=>b.disabled=true);$('#cmS').textContent=ai?'Claude 正在读说明并生成，约 1 分钟…':'生成中…';
    try{const r=await post('/api/settings/flow/draft',{path:cs[v]['路径'],ai});flowDlg(d,r.flow)}
    catch(e){toast(e.message);bs.forEach(b=>b.disabled=false);$('#cmS').textContent=''}};
  $('#cmAI').onclick=()=>go(true);$('#cmQk').onclick=()=>go(false);
}
function flowDlg(d,f){
  const fld=([k,lab,typ,help])=>{const v=f[k]??'';let inp;
    if(typ==='textarea')inp=`<textarea data-k="${k}" rows="${k==='开发步骤'?8:3}">${esc(v)}</textarea>`;
    else if(typ==='lines')inp=`<textarea data-k="${k}" rows="2">${esc((v||[]).join('\n'))}</textarea>`;
    else if(typ.startsWith('select:'))inp=`<select data-k="${k}">${typ.slice(7).split('|').map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else inp=`<input type="text" data-k="${k}" value="${esc(v)}" style="width:100%">`;
    return `<label style="display:block"><b class="small">${esc(lab)}</b>${inp}<div class="small mut">${esc(help)}</div></label>`};
  openDlg(f.id?`编辑开发流程：${f['名称']}`:'新建开发流程',`<div style="display:grid;gap:10px">
    ${f['内置']?'<div class="notice small" style="display:block">这是内置流程：保存后存为你的修改，随时可在设置页「恢复默认」。</div>':''}
    ${d.fields.map(fld).join('')}
    <div class="small mut">开发步骤、确认点、续跑提示、开发约定、需求变更提示里可用变量：${Object.entries(d.vars).map(([k,v])=>`<code>{${esc(k)}}</code> ${esc(v)}`).join('；')}</div>
    <div class="row"><button class="pri" id="flGo">保存</button><span class="mut small">⌘ + 回车 保存</span></div></div>`);
  const go=async()=>{const o={id:f.id||''};$('#dlgB').querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value);
    try{const r=await post('/api/settings/flow',{flow:o});dlg.close();toast(r.msg);render()}catch(e){toast(e.message)}};
  $('#flGo').onclick=go;$('#dlgB').onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))go()};
}

// ---------------- 基础知识库：所有期共用的账号、测试账号、代理 / VPN、环境配置
async function basePage(){
  const d=await api('/api/base'),es=d['条目'];
  const field=(e,f)=>`<tr><td>${esc(f['名'])}</td><td>${f['机密']?`<span class="sec" data-sv="${esc(e['编号'])}" data-sf="${esc(f['名'])}">●●●●●●</span> <a class="small" data-show>显示</a> · <a class="small" data-copy>复制</a>`:`${/^https?:\/\//.test(f['值'])?`<a href="${esc(f['值'])}" target="_blank" rel="noopener">${esc(f['值'])}</a>`:esc(f['值'])} <a class="small" data-cp="${esc(f['值'])}">复制</a>`}</td></tr>`;
  const card=e=>`<div class="bcard"><div class="t"><b>${esc(e['名称'])}</b><span class="small"><span class="mut">${esc(e['编号'])}</span> <a data-edit="${esc(e['编号'])}">编辑</a></span></div>
    ${e['适用']?`<div class="small mut">适用：${esc(e['适用'])}</div>`:''}
    <table>${(e['字段']||[]).map(f=>field(e,f)).join('')}</table>
    ${e['附件']&&e['附件'].length?`<div class="small">附件：${e['附件'].map(a=>`<a data-rf="${esc(d.dir+'/'+a)}">${esc(a.split('/').pop())}</a>`).join('　')}</div>`:''}
    ${e['备注']?`<div class="small md" style="margin-top:4px">${md(e['备注']).html}</div>`:''}</div>`;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h1>🗂 基础知识库</h1><button class="pri" id="bAdd">＋ 新增</button></div>
    <p class="mut">所有期共用的基础上下文：网站账号、测试账号、Wi-Fi / 代理 / VPN、环境配置等。Claude 回答和开发时会自动参考。
    密码等<b>机密字段只存 macOS 钥匙串</b>，页面默认隐藏；也可以直接跟 Claude 说「把 XX 测试账号记到基础知识库」。</p>
    ${es.length?d.cats.filter(c=>es.some(e=>e['分类']===c)).map(c=>`<h2>${esc(c)}</h2><div class="bgrid">${es.filter(e=>e['分类']===c).map(card).join('')}</div>`).join('')
      :'<p class="mut">还没有内容，点右上角「＋ 新增」。</p>'}
    ${d.files.length?`<h2>文件</h2><ul class="files">${d.files.map(f=>`<li><a data-rf="${esc(f.path)}">${esc(f.path.slice(d.dir.length+1))}</a><span class="mut small">${size(f.size)} · ${when(f.mtime)}</span></li>`).join('')}</ul>`:''}
    <p class="mut small">目录：${esc(d.dir)}</p>`;
  app.querySelectorAll('[data-rf]').forEach(a=>a.onclick=()=>readFile(a.dataset.rf));
  app.querySelectorAll('[data-cp]').forEach(a=>a.onclick=()=>{navigator.clipboard.writeText(a.dataset.cp);toast('已复制')});
  const secret=async el=>(await post('/api/base/secret',{id:el.dataset.sv,field:el.dataset.sf})).value;
  app.querySelectorAll('[data-show]').forEach(a=>a.onclick=async()=>{const el=a.previousElementSibling;
    if(el.dataset.shown){el.textContent='●●●●●●';delete el.dataset.shown;a.textContent='显示';return}
    try{el.textContent=await secret(el);el.dataset.shown=1;a.textContent='隐藏'}catch(e){toast(e.message)}});
  app.querySelectorAll('[data-copy]').forEach(a=>a.onclick=async()=>{try{await navigator.clipboard.writeText(await secret(a.parentElement.querySelector('[data-sv]')));toast('已复制')}catch(e){toast(e.message)}});
  const edit=e=>{
    const fs=e?e['字段']:[{'名':'账号','值':'','机密':false},{'名':'密码','值':'','机密':true}];
    const row=f=>`<div class="frow"><input type="text" class="fN" placeholder="字段名，如 账号 / 密码 / 代理地址" value="${esc(f['名'])}">
      <input type="${f['机密']?'password':'text'}" class="fV" placeholder="${f['机密']&&e?'留空 = 不修改':'值'}" value="${esc(f['机密']?'':f['值'])}">
      <label class="small row"><input type="checkbox" class="fS" ${f['机密']?'checked':''}>机密</label><a class="small" data-del>删除</a></div>`;
    openDlg(e?'编辑 '+e['编号']:'新增基础信息',`<div class="form">
      <label>分类<select id="bC">${d.cats.map(c=>`<option ${e&&e['分类']===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label>名称<input type="text" id="bN" value="${esc(e?e['名称']:'')}" placeholder="如：测试账号（国内）/ 办公室 Wi-Fi / 抓包代理"></label>
      <label>适用（产品 / 场景，可空）<input type="text" id="bS" value="${esc(e?e['适用']:'')}"></label>
      <div><div class="small mut" style="margin-bottom:4px">字段（勾选「机密」的只存钥匙串）</div><div id="bF" style="display:grid;gap:6px">${fs.map(row).join('')}</div>
        <a class="small" id="bFA" style="display:inline-block;margin-top:6px">＋ 添加字段</a></div>
      <label>备注（可空，支持 Markdown）<textarea id="bR" rows="3">${esc(e?e['备注']:'')}</textarea></label>
      <div class="row"><button class="pri" id="bGo">保存</button>${e?'<button class="danger" id="bDel">删除这条</button>':''}</div></div>`);
    const bind=()=>{$('#bF').querySelectorAll('[data-del]').forEach(a=>a.onclick=()=>a.parentElement.remove());
      $('#bF').querySelectorAll('.fS').forEach(c=>c.onchange=()=>c.closest('.frow').querySelector('.fV').type=c.checked?'password':'text')};
    bind();$('#bFA').onclick=()=>{$('#bF').insertAdjacentHTML('beforeend',row({'名':'','值':'','机密':false}));bind()};
    $('#bGo').onclick=async()=>{const fields=[...$('#bF').querySelectorAll('.frow')].map(r=>({'名':r.querySelector('.fN').value.trim(),'值':r.querySelector('.fV').value,'机密':r.querySelector('.fS').checked})).filter(f=>f['名']);
      try{const r=await post('/api/base/save',{id:e?e['编号']:'',category:$('#bC').value,name:$('#bN').value,scope:$('#bS').value,note:$('#bR').value,fields});dlg.close();toast(r.msg.split('\n')[0]);render()}catch(x){toast(x.message)}};
    if(e)$('#bDel').onclick=async()=>{if(!confirm('删除「'+e['名称']+'」？机密字段也会从钥匙串删除。'))return;
      try{const r=await post('/api/base/save',{id:e['编号'],delete:true});dlg.close();toast(r.msg);render()}catch(x){toast(x.message)}};
    $('#bN').focus()};
  $('#bAdd').onclick=()=>edit(null);
  app.querySelectorAll('[data-edit]').forEach(a=>a.onclick=()=>edit(es.find(x=>x['编号']===a.dataset.edit)));
}

async function render(){
  const h=decodeURIComponent(location.hash.slice(1)||'/');
  try{
    if(h.startsWith('/p/'))await period(h.slice(3));
    else if(h.startsWith('/d/'))await docs(h.slice(3));
    else if(h==='/base')await basePage();
    else if(h==='/settings')await settingsPage();
    else if(h==='/phones')await phonesPage();
    else if(h==='/bugs')await bugsPage();
    else if(h==='/anr')await anrPage();
    else if(h.startsWith('/tool/'))await toolPage(h.slice(6));
    else if(h.startsWith('/s/')){const [q,s]=h.slice(3).split('\u0001');await search(q,s)}
    else await overview();
  }catch(e){app.innerHTML=`<p>出错：${esc(e.message)}</p><p><a href="#/">返回首页</a></p>`}
  sideNav();
}
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(q)location.hash='#/s/'+enc(q+'\u0001'+$('#scope').value)};
$('#addBtn').onclick=()=>addDlg();
window.onhashchange=render;render();navRefresh();
// 实时更新：服务端有变化才推送（SSE），只刷新对应部分；不再定时轮询
let pagePending=false;
const curPeriod=()=>{const h=decodeURIComponent(location.hash.slice(1)||'/');return h.startsWith('/p/')?h.slice(3):null};
const canRender=()=>!Object.values(drafts).some(x=>x)&&!dlg.open&&!document.activeElement.matches('input,textarea,select');
function softRender(){if(!canRender()){pagePending=true;return}pagePending=false;const y=scrollY;render().then(()=>scrollTo(0,y))}
function onEvt(ev){
  const h=decodeURIComponent(location.hash.slice(1)||'/'), p=curPeriod();
  if(ev.kind==='dev'&&p===ev.period){if($('#pushBox'))pushBox(p);else devBox(p)}
  else if(ev.kind==='page'&&p===ev.period)softRender();
  else if(ev.kind==='overview'&&(h==='/'||h==='/bugs'||h==='/anr'))softRender();
  if(ev.kind==='overview'&&h!=='/')navRefresh();
  else if(ev.kind==='adds'){if(dlg.open&&$('#adList'))addList();else if(h==='/')softRender()}
}
function connectEvents(){
  const es=new EventSource('/api/events'),dot=$('#live');
  es.onopen=()=>{dot.className='live on';dot.title='实时连接中：有变化会自动更新'};
  es.onmessage=e=>{try{onEvt(JSON.parse(e.data))}catch(_){}};
  es.onerror=()=>{dot.className='live';dot.title='实时连接断开，正在重连…'};   // EventSource 会自动重连
}
connectEvents();
// 刚才因为在输入 / 弹窗开着而推迟的刷新，空下来再补上
document.addEventListener('focusout',()=>setTimeout(()=>{if(pagePending)softRender();else if(devPending&&curPeriod()===devPending){const n=devPending;devPending='';devBox(n)}},300));
dlg.addEventListener('close',()=>{if(pagePending)setTimeout(softRender,100)});
setInterval(()=>document.querySelectorAll('[data-since]').forEach(x=>x.textContent=since(x.dataset.since)),30000);   // 只更新「已运行」文字，不请求服务器
</script>
