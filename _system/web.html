<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地知识库</title>
<meta name="author" content="From 大大王.DT">
<!-- From 大大王.DT -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/ui/core.css">
<style>
/* 经典版骨架：左侧固定导航 + 顶部搜索栏 + 内容区（组件样式在 /ui/core.css） */
/* 布局：左侧固定导航 + 顶部搜索栏 + 内容区 */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-act);font-weight:700;font-size:16px;padding:4px 10px 14px}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--acc);color:#fff;font-style:normal;font-size:13px}
.navh{font-size:11px;letter-spacing:.08em;opacity:.55;padding:12px 10px 4px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px}
.navh:hover{opacity:.85}.navh::before{content:'›';font-size:14px;line-height:1;width:10px;display:inline-block;text-align:center;transform:rotate(90deg);transition:transform .15s}.navh.fold::before{transform:none}
.navh .hd{width:6px;height:6px;border-radius:50%;background:var(--s1);display:none}.navh.fold.alert .hd{display:inline-block}
.navh.fold+.navb{display:none}.navb{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--side-fg);min-width:0}
.nav:hover{background:rgba(255,255,255,.06);color:var(--side-act)}
.nav.on{background:rgba(255,255,255,.12);color:var(--side-act);font-weight:500}
.nav .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.nav .n{font-size:11px;background:rgba(255,255,255,.14);border-radius:999px;padding:0 7px;flex:none}
.nav .n.w{background:var(--s4);color:#fff}.nav .n.b{background:#c92a2a;color:#fff}.nav .n.q{background:var(--s1);color:#fff}
.plist.sub .nav{padding-left:26px;font-size:13px}.plist.sub .nav::before{content:"└";opacity:.4;margin-left:-14px;width:8px}
.nav .x{display:none;flex:none;opacity:.6;padding:0 3px;font-size:12px}.nav:hover .x{display:inline}.nav:hover .x+.n,.nav .x:hover{opacity:1}
.nav .d{width:7px;height:7px;border-radius:50%;flex:none;background:var(--s0)}
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:10px;display:flex;align-items:center;gap:6px}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px}
.topbar form{flex:1;max-width:680px;display:flex;gap:6px;min-width:0}
.topbar .sp{flex:1}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr)}.topbar{padding:8px 12px}main{padding:14px 12px 50px}.topbar #scope{display:none}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side .navh,.side .foot,.side .plist{display:none}.brand{width:100%}}
main{max-width:1280px;width:100%;padding:20px 20px 60px}
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="主导航">
  <a class="brand" href="#/"><i>KB</i>本地知识库</a>
  <div class="navh">工作台</div>
  <a class="nav" data-nav="/" href="#/"><span class="t">▦ 总览</span></a>
  <a class="nav" data-nav="/phones" href="#/phones"><span class="t">▯ 手机</span><span class="n" id="navPh"></span></a>
  <div class="navh">期</div>
  <div class="plist" id="navPs"></div>
  <div class="navh">事项</div>
  <a class="nav" data-nav="/bugs" href="#/bugs" title="Bug 平台（禅道、Jira…）的 Bug：自动归到期，认不出的待归纳"><span class="t">🐞 Bug</span><span class="n" id="navBug"></span></a>
  <div class="plist sub" id="navBugTs"></div>
  <a class="nav" data-nav="/anr" href="#/anr" title="ANR / 崩溃：按堆栈合并、计数、mapping 还原"><span class="t">💥 ANR / 崩溃</span><span class="n" id="navAnr"></span></a>
  <div class="plist sub" id="navAnrTs"></div>
  <div id="navEnt"></div>
  <div class="plist" id="navTs"></div>
  <div class="navh">共用</div>
  <a class="nav" data-nav="/base" href="#/base"><span class="t">◈ 基础信息</span></a>
  <div class="navh">系统</div>
  <a class="nav" data-nav="/settings" href="#/settings"><span class="t">⚙ 设置</span></a>
  <a class="nav" data-nav="/d/" href="#/d/" title="使用说明"><span class="t">? 帮助</span></a>
  <div class="foot"><span id="live" class="live" title="实时连接中…"></span><span>实时连接 · <span id="hostName"></span></span><a id="logout" hidden style="margin-left:auto;color:inherit">退出</a></div>
</aside>
<div class="mainc">
<header class="topbar">
  <form id="sf"><input type="text" id="q" placeholder="搜索需求、接口字段、设计说明、代码…"><select id="scope"><option value="all">全部</option><option value="docs">资料</option><option value="code">代码</option></select><button class="pri">搜索</button></form>
  <span class="sp"></span>
  <button id="addBtn" class="pri" title="交给管家：贴需求、日志、Bug、账号，或拖文件进来，它归到对应的地方并接着推动">＋ 添加</button>
</header>
<main id="app"></main>
</div>
</div>
<span hidden data-sign="From 大大王.DT">From 大大王.DT</span>
<script src="/ui-templates.js"></script>
<script src="/ui/core.js"></script>
</body>
</html>
