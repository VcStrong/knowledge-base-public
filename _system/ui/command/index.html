<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识库 · 指挥台</title>
<!-- From 大大王.DT -->
<!-- 界面模板「指挥台」：整个网站围绕一个会理解你的输入框。没有导航栏：输入框 = 搜索 + 跳转 + 交给管家，⌘K 打开命令面板。
     页面以「工作区」出现在输入框下方：面包屑 + 与当前上下文相关的建议 + 需要你判断的事。契约见 /ui/core.js 顶部 -->
<script>try{var t=localStorage.getItem('tpl.theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(_){}</script>
<link rel="stylesheet" href="/ui/core.css">
<link rel="stylesheet" href="/ui/command/skin.css">
</head>
<body class="tpl-boot">
<div class="tpl-shell">
  <header class="tpl-top" id="tplTop">
    <div class="tpl-topbar">
      <a class="tpl-mark" href="#/" title="回到首页"><i aria-hidden="true"></i><span>知识库</span></a>
      <span class="tpl-sp"></span>
      <button class="tpl-pulse" id="tplPulse" type="button" title="AI 现在的状态">…</button>
      <button class="tpl-iconbtn" id="tplK" type="button" title="命令面板：所有期、事项、页面和动作（⌘K / Ctrl+K）"><kbd>⌘K</kbd></button>
      <button class="tpl-iconbtn" id="tplAsk" type="button" title="打开交给管家的对话">管家</button>
      <span class="live" id="live" title="实时连接"></span>
    </div>
    <div class="tpl-hero" id="tplHero">
      <div class="tpl-greet" id="tplGreet"></div>
      <div class="tpl-say" id="tplSay"></div>
    </div>
    <div class="tpl-omni" id="tplOmni">
      <div class="tpl-omnibox">
        <span class="tpl-spark" aria-hidden="true"></span>
        <textarea id="tplQ" rows="1" spellcheck="false" autocomplete="off" aria-label="搜索、跳转，或交给管家" placeholder="搜索、跳转，或把任何东西交给我…"></textarea>
        <span class="tpl-hint" id="tplHint"><kbd>⌘K</kbd></span>
      </div>
      <div class="tpl-under" id="tplUnder" hidden></div>
    </div>
  </header>
  <section class="tpl-ctx" id="tplCtx" hidden></section>
  <main class="tpl-work" id="tplApp"></main>
  <footer class="tpl-foot" id="tplFoot"></footer>
</div>
<div class="tpl-pal" id="tplPal" hidden>
  <div class="tpl-palbox" role="dialog" aria-label="命令面板">
    <div class="tpl-palin"><span class="tpl-spark" aria-hidden="true"></span><input type="text" id="tplPalQ" autocomplete="off" spellcheck="false" placeholder="去哪里、做什么？输入期名、页面或动作"><kbd>esc</kbd></div>
    <div class="tpl-pallist" id="tplPalL"></div>
    <div class="tpl-palft"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>↵</kbd> 执行</span><span><kbd>esc</kbd> 关闭</span></div>
  </div>
</div>
<script src="/ui-templates.js"></script>
<script src="/ui/core.js"></script>
<script src="/ui/command/app.js"></script>
</body>
</html>
